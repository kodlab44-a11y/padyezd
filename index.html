    const normalizeStage = (str) => {
      if (!str) return "sifaris verilib";
      const s = String(str).toLowerCase();
      if (s.includes("tehvil") || s.includes("pickup") || s.includes("выдач")) return "tehvil menteqesindedi";
      if (s.includes("gomruk") || s.includes("gömrük") || s.includes("customs") || s.includes("таможен")) return "gomruk yoxlanisindadir";
      if (s.includes("terminal") || s.includes("baki") || s.includes("баку")) return "baki kargo terminali";
      if (s.includes("gonderilib") || s.includes("göndərildi") || s.includes("dispatch") || s.includes("отправлен")) return "azerbaycana gonderilib";
      if (s.includes("anbar") || s.includes("warehouse") || s.includes("склад")) return "xarici anbar";
      return "sifaris verilib";
    };

      return idx >= 0 ? idx : 0;

      if (!dateStr) return "";
      try {
        const parts = String(dateStr).split("-");
        if (parts.length === 3) {

        }
      } catch (e) {}
      return dateStr;

      const [lang, setLang] = useState(() => localStorage.getItem("padyezd_lang") || "az");
      const [theme, setTheme] = useState(() => localStorage.getItem("padyezd_theme") || "dark");
      const [trackInput, setTrackInput] = useState("");
      const [trackedOrder, setTrackedOrder] = useState(null);
      const [loading, setLoading] = useState(false);
      const [searchAttempted, setSearchAttempted] = useState(false);
      const [toast, setToast] = useState(null);
      const [hoveredStageId, setHoveredStageId] = useState(null);

      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        localStorage.setItem("padyezd_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === "dark" ? "light" : "dark"));

      const handleLangChange = (newLang) => {
        setLang(newLang);
        localStorage.setItem("padyezd_lang", newLang);
      };

      const t = (key) => (I18N[lang] && I18N[lang][key]) || (I18N.az && I18N.az[key]) || key;

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast(t("copied"));
      };

      const performSearch = async (queryCode) => {
        const clean = (queryCode || "").trim().toLowerCase();
        if (!clean) {
          showToast(t("toastEnterCode"), "error");
          return;
        }

        setLoading(true);
        setSearchAttempted(true);

        try {
          const res = await fetch("/api/orders?code=" + encodeURIComponent(clean));
          if (res.ok) {
            const data = await res.json();
            if (data && (data.izlemeKodu || data.izleme_kodu)) {
              const formatted = {
                id: data.id,
                mehsul: data.mehsul,
                musteri: data.musteri,
                telefon: data.telefon,
                baglamaNomre: data.baglamaNomre || data.baglama_nomre,
                izlemeKodu: data.izlemeKodu || data.izleme_kodu,
                status: normalizeStage(data.status),
                tarix: data.tarix,
                qeyd: data.qeyd,
                stageDates: data.stageDates || {}
              };
              setTrackedOrder(formatted);
              window.location.hash = formatted.izlemeKodu;
              setLoading(false);
              showToast(t("toastFound"));
              return;
            }
          }
        } catch (err) {}

        // Local Storage fallback
        try {
          const saved = localStorage.getItem("padyezd_orders");
          if (saved) {
            const parsed = JSON.parse(saved);
            const found = parsed.find(
              o => (o.izlemeKodu && o.izlemeKodu.toLowerCase() === clean) ||
                   (o.baglamaNomre && o.baglamaNomre.toLowerCase() === clean)
            );
            if (found) {
              setTrackedOrder({
                ...found,
                status: normalizeStage(found.status),
                stageDates: found.stageDates || {}
              });
              window.location.hash = found.izlemeKodu;
              setLoading(false);
              showToast(t("toastFound"));
              return;
            }
          }
        } catch (e) {}

        setTrackedOrder(null);
        setLoading(false);
      };

      useEffect(() => {
        const hash = window.location.hash.replace("#", "").trim();
        if (hash) {
          setTrackInput(hash);
          performSearch(hash);
        }
      }, []);

      const curIdx = trackedOrder ? getStageIndex(trackedOrder.status) : 0;
      const curStage = STAGES[curIdx] || STAGES[0];
      const isDark = theme === "dark";

        <div className="min-h-screen flex flex-col justify-between">
