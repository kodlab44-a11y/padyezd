      const [isAuthed, setIsAuthed] = useState(() => sessionStorage.getItem("padyezd_admin_session") === "active");
      const [authPin, setAuthPin] = useState("");
      const [showPin, setShowPin] = useState(false);
      const [authError, setAuthError] = useState(false);
      const [orders, setOrders] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [showModal, setShowModal] = useState(false);
      const [editId, setEditId] = useState(null);
      const [toast, setToast] = useState(null);

      const [formData, setFormData] = useState({
        mehsul: "",
        musteri: "",
        telefon: "",
        baglamaNomre: "",
        izlemeKodu: "",
        mayaCny: "",
        mayaAzn: "",
        kargo: "",
        satis: "",
        status: "sifaris verilib",
        tarix: new Date().toISOString().split("T")[0],
        qeyd: ""
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        localStorage.setItem("padyezd_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === "dark" ? "light" : "dark");

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

            // Load Orders: from cloud DB with local cache and auto-sync
      const loadOrders = async () => {
        const saved = localStorage.getItem("padyezd_orders");
        let localList = [];
        if (saved) {
          try {
            localList = JSON.parse(saved);
            setOrders(localList);
          } catch (e) {}
        }

        // 1. Fetch from cloud database
        try {
          const res = await fetch("/api/orders", {
            headers: { "x-admin-key": MASTER_PASSWORD }
          });
          if (res.ok) {
            const cloudOrders = await res.json();
            if (Array.isArray(cloudOrders)) {
              // Merge any local-only orders that cloud doesn't have yet
              const cloudIds = new Set(cloudOrders.map(o => String(o.id)));
              const unsynced = localList.filter(o => !cloudIds.has(String(o.id)));

              // Auto-sync any unsynced local orders to cloud DB
              for (const item of unsynced) {
                fetch("/api/orders", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "x-admin-key": MASTER_PASSWORD },
                  body: JSON.stringify(item)
                }).catch(() => {});
              }

              const merged = [...unsynced, ...cloudOrders];
              setOrders(merged);
              localStorage.setItem("padyezd_orders", JSON.stringify(merged));
              return;
            }
          }
        } catch (err) {
          console.warn("Could not fetch from cloud DB:", err);
        }
      };

      useEffect(() => {
        if (!isAuthed) return;
        loadOrders();
      }, [isAuthed]);

      // Save Orders to LocalStorage and Cloud DB
      const persistOrders = async (newOrders, actionOrder = null, isDelete = false) => {
        setOrders(newOrders);
        localStorage.setItem("padyezd_orders", JSON.stringify(newOrders));

        // Cloud DB Sync
        if (actionOrder) {
          try {
            if (isDelete) {
              await fetch("/api/orders?id=" + encodeURIComponent(actionOrder.id), {
                method: "DELETE",
                headers: { "x-admin-key": MASTER_PASSWORD }
              });
            } else {
              await fetch("/api/orders", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-admin-key": MASTER_PASSWORD
                },
                body: JSON.stringify(actionOrder)
              });
            }
          } catch (err) {
            console.error("Cloud DB sync failed:", err);
          }
        }
      };

      const handleLogin = (e) => {
        e && e.preventDefault();
        const storedPass = localStorage.getItem("padyezd_admin_password") || MASTER_PASSWORD;
        if (authPin.trim() === storedPass) {
          sessionStorage.setItem("padyezd_admin_session", "active");
          setIsAuthed(true);
          setAuthError(false);
          showToast("Giriş uğurludur");
        } else {
          setAuthError(true);
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem("padyezd_admin_session");
        setIsAuthed(false);
        setAuthPin("");
      };

      const generateCodes = () => {
        const rand = Math.floor(10000 + Math.random() * 90000);
        return {
          baglamaNomre: `CN-${rand}${Math.floor(10 + Math.random() * 89)}`,
          izlemeKodu: `PD-${rand}`
        };
      };

      const openCreateModal = () => {
        const codes = generateCodes();
        setEditId(null);
        setFormData({
          mehsul: "",
          musteri: "",
          telefon: "",
          baglamaNomre: codes.baglamaNomre,
          izlemeKodu: codes.izlemeKodu,
          mayaCny: "",
          mayaAzn: "",
          kargo: "",
          satis: "",
          status: "sifaris verilib",
          tarix: new Date().toISOString().split("T")[0],
          qeyd: ""
        });
        setShowModal(true);
      };

      const openEditModal = (order) => {
        setEditId(order.id);
        setFormData({
          mehsul: order.mehsul || "",
          musteri: order.musteri || "",
          telefon: order.telefon || "",
          baglamaNomre: order.baglamaNomre || "",
          izlemeKodu: order.izlemeKodu || "",
          mayaCny: order.mayaCny || "",
          mayaAzn: order.mayaAzn || "",
          kargo: order.kargo || "",
          satis: order.satis || "",
          status: normalizeStage(order.status),
          tarix: order.tarix || "",
          qeyd: order.qeyd || ""
        });
        setShowModal(true);
      };

      const handleSaveOrder = async (e) => {
        e.preventDefault();
        if (!formData.mehsul.trim()) {
          showToast("Məhsul adını daxil edin", "error");
          return;
        }

        const codes = generateCodes();
        const orderToSave = {
          id: editId || Date.now(),
          mehsul: formData.mehsul.trim(),
          musteri: formData.musteri.trim(),
          telefon: formData.telefon.trim(),
          baglamaNomre: formData.baglamaNomre.trim() || codes.baglamaNomre,
          izlemeKodu: formData.izlemeKodu.trim() || codes.izlemeKodu,
          mayaCny: formData.mayaCny || "0",
          mayaAzn: formData.mayaAzn || "0",
          kargo: formData.kargo || "0",
          satis: formData.satis || "0",
          status: normalizeStage(formData.status),
          tarix: formData.tarix || new Date().toISOString().split("T")[0],
          qeyd: formData.qeyd.trim()
        };

        const updatedList = editId
          ? orders.map(o => o.id === editId ? orderToSave : o)
          : [orderToSave, ...orders];

        await persistOrders(updatedList, orderToSave, false);
        showToast(editId ? "Sifariş yeniləndi (Buludda saxlanıldı)" : "Yeni sifariş yaradıldı (Buludda saxlanıldı)");
        setShowModal(false);
      };

      const handleDeleteOrder = async (orderId) => {
        if (confirm("Bu sifarişi silmək istədiyinizdən əminsiniz?")) {
          const toDelete = orders.find(o => o.id === orderId) || { id: orderId };
          const updatedList = orders.filter(o => o.id !== orderId);
          await persistOrders(updatedList, toDelete, true);
          showToast("Sifariş silindi");
        }
      };

      const handleAdvanceStatus = async (orderId) => {
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        const currentIdx = STAGE_KEYS.indexOf(normalizeStage(order.status));
        const nextIdx = Math.min(currentIdx + 1, STAGE_KEYS.length - 1);
        const nextStage = STAGE_KEYS[nextIdx];
        const updatedOrder = { ...order, status: nextStage };
        const updatedList = orders.map(o => o.id === orderId ? updatedOrder : o);
        await persistOrders(updatedList, updatedOrder, false);
        showToast("Status: " + STAGE_LABELS[nextStage]);
      };

      const handleStatusSelect = async (orderId, newStatus) => {
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        const norm = normalizeStage(newStatus);
        const updatedOrder = { ...order, status: norm };
        const updatedList = orders.map(o => o.id === orderId ? updatedOrder : o);
        await persistOrders(updatedList, updatedOrder, false);
        showToast("Status: " + STAGE_LABELS[norm]);
      };

      // Filtered Orders
      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          const matchQuery = !searchQuery || 
            (o.mehsul && o.mehsul.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (o.musteri && o.musteri.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (o.izlemeKodu && o.izlemeKodu.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (o.baglamaNomre && o.baglamaNomre.toLowerCase().includes(searchQuery.toLowerCase()));

          const matchStatus = statusFilter === "all" || normalizeStage(o.status) === statusFilter;
          return matchQuery && matchStatus;
        });
      }, [orders, searchQuery, statusFilter]);

      const isDark = theme === "dark";

      // 1. AUTH SCREEN (IF NOT LOGGED IN)
      if (!isAuthed) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="theme-card rounded-2xl p-8 max-w-sm w-full border text-center space-y-5">
              <div className={`w-14 h-14 rounded-xl overflow-hidden border mx-auto flex items-center justify-center ${isDark ? "bg-black border-zinc-800" : "bg-zinc-100 border-zinc-300"}`}>
                <img src={LOGO_SRC} onError={(e) => { e.currentTarget.src = LOGO_FALLBACK; }} alt="padyezd*" className="w-full h-full object-cover" />
              </div>
              <div>
                <h2 className={`font-syne text-xl font-bold ${isDark ? "text-white" : "text-black"}`}>Təhlükəsiz İdarəetmə Girişi</h2>
                <p className="text-xs text-zinc-500 mt-1">İdarəetmə paneli üçün master şifrəni daxil edin</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-3">
                <div className="relative">
                  <input
                    type={showPin ? "text" : "password"}
                    value={authPin}
                    onChange={(e) => setAuthPin(e.target.value)}
                    placeholder="Şifrə..."
                    className={`w-full rounded-lg px-3 py-2.5 text-sm font-mono text-center border focus:outline-none ${
                      isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"
                    }`}
                    autoFocus
                  />
                  <button
                    type="button"
                    onClick={() => setShowPin(!showPin)}
                    className="absolute right-3 top-3 text-zinc-500 hover:text-zinc-300"
                    title={showPin ? "Gizlə" : "Göstər"}
                  >
                    {showPin ? <Icons.EyeOff size={16} /> : <Icons.Eye size={16} />}
                  </button>
                </div>

                {authError && <div className="text-xs text-rose-400 font-mono">Şifrə yanlışdır. Yenidən cəhd edin.</div>}
                
                <button
                  type="submit"
                  className={`w-full py-2.5 rounded-lg font-bold text-xs tracking-wide transition-all ${
                    isDark ? "bg-white hover:bg-zinc-200 text-black" : "bg-black hover:bg-zinc-800 text-white"
                  }`}
                >
                  Daxil Ol
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 2. DASHBOARD VIEW (AUTHENTICATED)
      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* TOAST */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-fade-in">
              <div className={`px-4 py-2.5 rounded-xl font-mono text-xs flex items-center gap-2 border shadow-xl ${
                toast.type === "error" ? "bg-rose-950/90 text-rose-300 border-rose-800" : isDark ? "bg-zinc-900/90 text-white border-zinc-700" : "bg-white text-zinc-900 border-zinc-300"
              }`}>
                <Icons.Check size={14} className={toast.type === "error" ? "text-rose-400" : "text-emerald-400"} />
                <span>{toast.msg}</span>
              </div>
            </div>
          )}

          {/* HEADER */}
          <header className={`border-b transition-colors ${isDark ? "border-zinc-800 bg-zinc-950/70" : "border-zinc-200 bg-white/80"} backdrop-blur sticky top-0 z-40`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className={`w-9 h-9 rounded-lg overflow-hidden border flex items-center justify-center ${isDark ? "bg-black border-zinc-800" : "bg-zinc-100 border-zinc-300"}`}>
                  <img src={LOGO_SRC} onError={(e) => { e.currentTarget.src = LOGO_FALLBACK; }} alt="padyezd*" className="w-full h-full object-cover" />
                </div>
                <div>
                  <span className={`font-syne font-black text-lg ${isDark ? "text-white" : "text-black"}`}>padyezd<span className="text-zinc-500 font-mono">*</span></span>
                  <span className="hidden sm:inline-block ml-2 text-[10px] font-mono uppercase tracking-widest text-zinc-500">İdarəetmə Paneli</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={toggleTheme}
                  className={`p-2 rounded-lg border transition-colors ${isDark ? "bg-zinc-900 border-zinc-800 text-zinc-300 hover:text-white" : "bg-zinc-100 border-zinc-300 text-zinc-700 hover:text-black"}`}
                >
                  {isDark ? <Icons.Sun size={17} /> : <Icons.Moon size={17} />}
                </button>

                <button
                  onClick={openCreateModal}
                  className={`px-3.5 py-2 rounded-lg font-bold text-xs flex items-center gap-1.5 transition-all ${isDark ? "bg-white hover:bg-zinc-200 text-black" : "bg-black hover:bg-zinc-800 text-white"}`}
                >
                  <Icons.Plus size={15} />
                  <span>Yeni Sifariş</span>
                </button>

                <button
                  onClick={handleLogout}
                  className={`p-2 rounded-lg border transition-colors ${isDark ? "bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-rose-400" : "bg-zinc-100 border-zinc-300 text-zinc-600 hover:text-rose-600"}`}
                  title="Çıxış"
                >
                  <Icons.Lock size={16} />
                </button>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 flex-1 space-y-6">
            
            {/* SEARCH & FILTERS BAR */}
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="relative w-full sm:w-80">
                <Icons.Search size={16} className="absolute left-3 top-3 text-zinc-500" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Məhsul, müştəri, kod üzrə axtar..."
                  className={`w-full pl-9 pr-3 py-2 rounded-xl text-xs font-mono border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-800 text-white" : "bg-white border-zinc-300 text-black"}`}
                />
              </div>

              <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                <button
                  onClick={() => setStatusFilter("all")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold border whitespace-nowrap transition-colors ${
                    statusFilter === "all" ? isDark ? "bg-white text-black border-white" : "bg-black text-white border-black" : isDark ? "bg-zinc-900 border-zinc-800 text-zinc-400" : "bg-zinc-100 border-zinc-300 text-zinc-600"
                  }`}
                >
                  Hamısı ({orders.length})
                </button>
                {STAGE_KEYS.map(k => (
                  <button
                    key={k}
                    onClick={() => setStatusFilter(k)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold border whitespace-nowrap transition-colors ${
                      statusFilter === k ? isDark ? "bg-white text-black border-white" : "bg-black text-white border-black" : isDark ? "bg-zinc-900 border-zinc-800 text-zinc-400" : "bg-zinc-100 border-zinc-300 text-zinc-600"
                    }`}
                  >
                    {STAGE_LABELS[k]} ({orders.filter(o => normalizeStage(o.status) === k).length})
                  </button>
                ))}
              </div>
            </div>

            {/* ORDERS TABLE */}
            <div className="theme-card rounded-2xl border overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs font-mono">
                  <thead className={`border-b text-[11px] uppercase tracking-wider text-zinc-500 ${isDark ? "bg-zinc-900/60 border-zinc-800" : "bg-zinc-100/60 border-zinc-200"}`}>
                    <tr>
                      <th className="py-3 px-4">Məhsul</th>
                      <th className="py-3 px-4">Müştəri / Əlaqə</th>
                      <th className="py-3 px-4">İzləmə Kodu</th>
                      <th className="py-3 px-4">Bağlama №</th>
                      <th className="py-3 px-4">Qiymət</th>
                      <th className="py-3 px-4">Cari Mərhələ</th>
                      <th className="py-3 px-4 text-center">Növbətiyə Keçir</th>
                      <th className="py-3 px-4 text-right">Əməliyyat</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-800/40">
                    {filteredOrders.length === 0 ? (
                      <tr>
                        <td colSpan="8" className="py-12 text-center text-zinc-500 font-mono text-xs">
                          Heç bir sifariş tapılmadı. "+ Yeni Sifariş" düyməsinə klikləyərək əlavə edə bilərsiniz.
                        </td>
                      </tr>
                    ) : (
                      filteredOrders.map(order => {
                        const norm = normalizeStage(order.status);
                        const curIdx = STAGE_KEYS.indexOf(norm);
                        const isLastStage = curIdx >= STAGE_KEYS.length - 1;

                        return (
                          <tr key={order.id} className={isDark ? "hover:bg-zinc-900/30" : "hover:bg-zinc-50"}>
                            <td className="py-3 px-4 font-sans font-bold text-sm">
                              <span className={isDark ? "text-white" : "text-black"}>{order.mehsul}</span>
                              {order.qeyd && <span className="block text-[11px] font-mono text-zinc-500 font-normal">{order.qeyd}</span>}
                            </td>
                            <td className="py-3 px-4 font-sans">
                              <div className="font-semibold">{order.musteri || "—"}</div>
                              <div className="text-[11px] font-mono text-zinc-500">{order.telefon || "—"}</div>
                            </td>
                            <td className="py-3 px-4 font-bold">
                              <span className={`px-2 py-1 rounded border ${isDark ? "bg-zinc-900 border-zinc-800 text-zinc-300" : "bg-zinc-100 border-zinc-300 text-zinc-800"}`}>
                                {order.izlemeKodu}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-zinc-400">
                              {order.baglamaNomre}
                            </td>
                            <td className="py-3 px-4 font-bold text-emerald-500">
                              {order.satis ? `${order.satis} ₼` : "—"}
                            </td>
                            <td className="py-3 px-4">
                              <select
                                value={norm}
                                onChange={(e) => handleStatusSelect(order.id, e.target.value)}
                                className={`text-xs font-mono font-semibold px-2 py-1 rounded-md border focus:outline-none cursor-pointer ${
                                  isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"
                                }`}
                              >
                                {STAGE_KEYS.map(k => (
                                  <option key={k} value={k}>{STAGE_LABELS[k]}</option>
                                ))}
                              </select>
                            </td>
                            <td className="py-3 px-4 text-center">
                              <button
                                onClick={() => handleAdvanceStatus(order.id)}
                                disabled={isLastStage}
                                className={`px-2.5 py-1 rounded-md text-[11px] font-bold inline-flex items-center gap-1 border transition-all ${
                                  isLastStage 
                                    ? "opacity-30 cursor-not-allowed border-transparent text-zinc-500" 
                                    : isDark ? "bg-zinc-800 hover:bg-zinc-700 text-white border-zinc-700" : "bg-zinc-100 hover:bg-zinc-200 text-black border-zinc-300"
                                }`}
                              >
                                <span>İrəli</span>
                                <Icons.ArrowRight size={12} />
                              </button>
                            </td>
                            <td className="py-3 px-4 text-right">
                              <div className="inline-flex items-center gap-1">
                                <button
                                  onClick={() => openEditModal(order)}
                                  className="p-1.5 rounded hover:text-white text-zinc-400 transition-colors"
                                  title="Düzəliş et"
                                >
                                  <Icons.Edit size={14} />
                                </button>
                                <button
                                  onClick={() => handleDeleteOrder(order.id)}
                                  className="p-1.5 rounded hover:text-rose-400 text-zinc-400 transition-colors"
                                  title="Sil"
                                >
                                  <Icons.Trash size={14} />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </main>

          {/* CREATE / EDIT MODAL */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="theme-card rounded-2xl max-w-lg w-full p-6 border space-y-4">
                <div className="flex items-center justify-between border-b pb-3 border-zinc-800">
                  <h3 className={`font-syne font-bold text-lg ${isDark ? "text-white" : "text-black"}`}>
                    {editId ? "Sifarişi Redaktə Et" : "Yeni Sifariş Əlavə Et"}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-zinc-500 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveOrder} className="space-y-4 text-xs font-mono">
                  <div>
                    <label className="text-zinc-500 block mb-1">Məhsulun Adı *</label>
                    <input
                      type="text"
                      required
                      value={formData.mehsul}
                      onChange={(e) => setFormData({ ...formData, mehsul: e.target.value })}
                      placeholder="Məhsulun adı"
                      className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-zinc-500 block mb-1">Müştərinin Adı</label>
                      <input
                        type="text"
                        value={formData.musteri}
                        onChange={(e) => setFormData({ ...formData, musteri: e.target.value })}
                        placeholder="Ad və soyad"
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                      />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-1">Əlaqə Nömrəsi</label>
                      <input
                        type="text"
                        value={formData.telefon}
                        onChange={(e) => setFormData({ ...formData, telefon: e.target.value })}
                        placeholder="+994 50 123 45 67"
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-zinc-500 block mb-1">İzləmə Kodu (Müştəri üçün)</label>
                      <input
                        type="text"
                        value={formData.izlemeKodu}
                        onChange={(e) => setFormData({ ...formData, izlemeKodu: e.target.value })}
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white font-bold" : "bg-white border-zinc-300 text-black font-bold"}`}
                      />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-1">Bağlama №</label>
                      <input
                        type="text"
                        value={formData.baglamaNomre}
                        onChange={(e) => setFormData({ ...formData, baglamaNomre: e.target.value })}
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-zinc-500 block mb-1">Satış Qiyməti (₼ AZN)</label>
                      <input
                        type="number"
                        step="0.01"
                        value={formData.satis}
                        onChange={(e) => setFormData({ ...formData, satis: e.target.value })}
                        placeholder="0.00"
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                      />
                    </div>
                    <div>
                      <label className="text-zinc-500 block mb-1">Cari Mərhələ *</label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        className={`w-full px-3 py-2 rounded-lg border focus:outline-none cursor-pointer ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                      >
                        {STAGE_KEYS.map(k => (
                          <option key={k} value={k}>{STAGE_LABELS[k]}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-zinc-500 block mb-1">Qeyd (Ölçü, rəng və s.)</label>
                    <input
                      type="text"
                      value={formData.qeyd}
                      onChange={(e) => setFormData({ ...formData, qeyd: e.target.value })}
                      placeholder="Məsələn: Ölçü 42 EU, qara"
                      className={`w-full px-3 py-2 rounded-lg border focus:outline-none ${isDark ? "bg-zinc-900 border-zinc-700 text-white" : "bg-white border-zinc-300 text-black"}`}
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-3 border-t border-zinc-800">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 rounded-lg border border-zinc-700 text-zinc-400 hover:text-white"
                    >
                      Ləğv et
                    </button>
                    <button
                      type="submit"
                      className={`px-5 py-2 rounded-lg font-bold text-xs ${isDark ? "bg-white hover:bg-zinc-200 text-black" : "bg-black hover:bg-zinc-800 text-white"}`}
                    >
                      {editId ? "Yadda Saxla" : "Sifarişi Yarat"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AdminApp />);
  </script>
</body>
</html>
